<section class="auth">
  <div class="art"><div class="blob"></div><h2>Welcome back 👋</h2><p>Log in to track orders, save favourites and checkout faster.</p><div class="emoji">🛍️</div></div>
  <div class="panel">
    <form class="card box" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h1>Login</h1><p class="sub">Enter your details to continue.</p>
      @if (ok()) { <div class="alert-ok">🎉 Logged in successfully (demo).</div> }
      <label class="field">Email<input type="email" formControlName="email" placeholder="you@example.com" [class.err]="bad('email')" />@if (bad('email')) { <em>Enter a valid email.</em> }</label>
      <label class="field">Password
        <span class="pw"><input [type]="show() ? 'text' : 'password'" formControlName="password" placeholder="••••••••" [class.err]="bad('password')" /><button type="button" (click)="show.set(!show())">{{ show() ? '🙈' : '👁️' }}</button></span>
        @if (bad('password')) { <em>Password must be at least 6 characters.</em> }
      </label>
      <div class="between"><label class="chk"><input type="checkbox" formControlName="remember" /> Remember me</label><a href="#" (click)="$event.preventDefault()">Forgot password?</a></div>
      <button class="btn btn-primary btn-block" type="submit">Login</button>
      <div class="or"><span>or continue with</span></div>
      <div class="social"><button type="button" class="btn btn-ghost">🔵 Google</button><button type="button" class="btn btn-ghost">⚫ GitHub</button></div>
      <p class="alt">New here? <a routerLink="/register">Create an account</a></p>
    </form>
  </div>
</section>
